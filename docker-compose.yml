services:
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: distributor_inventory
      POSTGRES_USER: ${DEMO_DB_USER:-demo}
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-demo-local-only}
    ports:
      - "127.0.0.1:${INVENTORY_DB_HOST_PORT:-15432}:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
      - ./services/inventory-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/synthetic_inventory.sql:/docker-entrypoint-initdb.d/02-synthetic-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d distributor_inventory"]
      interval: 3s
      timeout: 3s
      retries: 20

  procurement-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: distributor_procurement
      POSTGRES_USER: ${DEMO_DB_USER:-demo}
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-demo-local-only}
    ports:
      - "127.0.0.1:${PROCUREMENT_DB_HOST_PORT:-15433}:5432"
    volumes:
      - procurement_data:/var/lib/postgresql/data
      - ./services/procurement-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/synthetic_procurement.sql:/docker-entrypoint-initdb.d/02-synthetic-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d distributor_procurement"]
      interval: 3s
      timeout: 3s
      retries: 20

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      INVENTORY_DATABASE_URL: postgres://${DEMO_DB_USER:-demo}:${DEMO_DB_PASSWORD:-demo-local-only}@inventory-db:5432/distributor_inventory
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-10000000-0000-4000-8000-000000000001}
      INVENTORY_PORT: 4101
      RUST_LOG: info
    ports:
      - "127.0.0.1:${INVENTORY_API_PORT:-4101}:4101"
    depends_on:
      inventory-db:
        condition: service_healthy

  procurement-service:
    build:
      context: .
      dockerfile: services/procurement-service/Dockerfile
    environment:
      PROCUREMENT_DATABASE_URL: postgres://${DEMO_DB_USER:-demo}:${DEMO_DB_PASSWORD:-demo-local-only}@procurement-db:5432/distributor_procurement
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-10000000-0000-4000-8000-000000000001}
      PROCUREMENT_PORT: 4102
      RUST_LOG: info
    ports:
      - "127.0.0.1:${PROCUREMENT_API_PORT:-4102}:4102"
    depends_on:
      procurement-db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:-http://localhost:4101}
        NEXT_PUBLIC_PROCUREMENT_API_URL: ${NEXT_PUBLIC_PROCUREMENT_API_URL:-http://localhost:4102}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - inventory-service
      - procurement-service

volumes:
  inventory_data:
  procurement_data: